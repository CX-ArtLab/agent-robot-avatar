<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Love 表情调参器</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#15171a;background:#f7f7f5}
  .page{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:100vh}
  .stage{position:relative;background-color:#f8f8f6;background-image:radial-gradient(#d7d9dc 1px,transparent 1px);background-size:24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:32px 20px}
  .title{position:absolute;left:28px;top:22px;font-size:13px;color:#8a8f98;letter-spacing:.04em}
  .big{position:relative;width:300px;height:300px;display:grid;place-items:center}
  .big agent-robot-avatar{filter:drop-shadow(0 12px 24px rgba(0,0,0,.08))}
  .guides{position:absolute;inset:0;pointer-events:none;display:none}
  .guides.on{display:block}
  .guides i{position:absolute;display:block}
  .g-v{left:50%;top:0;bottom:0;border-left:1px dashed rgba(70,110,255,.45)}
  .g-h{top:50%;left:0;right:0;border-top:1px dashed rgba(70,110,255,.45)}
  .g-body{border:1px dashed rgba(70,110,255,.28);border-radius:22%}
  .g-heart{left:0;right:0;border-top:1px dashed rgba(255,70,110,.8)}
  .sizes{display:flex;align-items:flex-end;gap:36px;color:#8a8f98;font-size:11px}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:8px}
  .transport{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;border-radius:16px;background:rgba(255,255,255,.88);box-shadow:0 7px 30px rgba(0,0,0,.08)}
  button{border:0;background:#f1f2f3;padding:8px 12px;border-radius:10px;font-size:12px;color:#333;cursor:pointer;white-space:nowrap;font-family:inherit}
  button:hover{background:#e7e8ea} button:active{transform:translateY(1px)}
  button.primary{background:#666b72;color:#fff} button.primary:hover{background:#585d63}
  .toggles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:#666b72}
  .toggles label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .panel{background:#fff;border-left:1px solid #ececec;padding:22px 22px 40px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
  .panel h2{margin:22px 0 10px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8a8f98;text-transform:uppercase}
  .panel h2:first-child{margin-top:0}
  .row{display:grid;grid-template-columns:92px 1fr 62px 26px;align-items:center;gap:8px;margin:7px 0;font-size:12px;color:#444}
  .row .hint{grid-column:2 / 5;margin:-3px 0 2px;font-size:10px;color:#a0a4ab}
  .row input[type=range]{width:100%;accent-color:#666b72}
  .row input[type=number]{width:62px;padding:4px 6px;border:1px solid #e2e3e5;border-radius:8px;font-size:12px;font-family:inherit;color:#333}
  .row.changed label{color:#d6336c;font-weight:600}
  .row .undo{width:26px;height:26px;padding:0;border-radius:8px;font-size:13px;line-height:1;background:#fdecf2;color:#d6336c}
  .row .undo:hover{background:#fadbe7}
  .row:not(.changed) .undo{opacity:.3;pointer-events:none;background:#f1f2f3;color:#8a8f98}
  .stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:#555;padding:10px 12px;border-radius:12px;background:#f6f6f4;font-variant-numeric:tabular-nums}
  .stats b{color:#15171a;font-weight:600}
  textarea{width:100%;height:150px;resize:vertical;border:1px solid #e2e3e5;border-radius:10px;padding:10px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#333;background:#fafafa}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .note{margin-top:8px;font-size:11px;color:#8a8f98;line-height:1.55}
  @media (max-width:860px){
    .page{grid-template-columns:1fr}
    .panel{position:static;max-height:none;border-left:0;border-top:1px solid #ececec}
    .stage{min-height:auto;padding-top:60px}
  }
</style>
</head>
<body>
<div class="page">
  <main class="stage">
    <div class="title">Agent Robot Avatar — Love 表情调参器</div>

    <div class="big" id="big">
      <agent-robot-avatar id="face" size="300"></agent-robot-avatar>
      <div class="guides" id="guides">
        <i class="g-v"></i><i class="g-h"></i>
        <i class="g-body" id="gBody"></i>
        <i class="g-heart" id="gHeart"></i>
      </div>
    </div>

    <div class="sizes">
      <figure><agent-robot-avatar id="faceMid" size="112"></agent-robot-avatar>112px（默认尺寸）</figure>
      <figure><agent-robot-avatar id="faceSmall" size="56"></agent-robot-avatar>56px（聊天头像）</figure>
    </div>

    <div class="transport">
      <button type="button" class="primary" id="play">▶ 播放</button>
      <button type="button" id="idle">停止 / 复位</button>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="loop"> 循环播放</label>
      <label><input type="checkbox" id="hold"> 停住心形（便于看形状）</label>
      <label><input type="checkbox" id="auto" checked> 改时间/摇摆参数后自动重播</label>
      <label><input type="checkbox" id="guideToggle" checked> 参考线</label>
    </div>
  </main>

  <aside class="panel">
    <h2>心形</h2>
    <div id="g-shape"></div>
    <h2>心跳</h2>
    <div id="g-beat"></div>
    <h2>过渡</h2>
    <div id="g-timing"></div>
    <h2>头部</h2>
    <div id="g-head"></div>

    <h2>实时读数（单位：头像 240 坐标）</h2>
    <div class="stats" id="stats"></div>

    <h2>当前参数</h2>
    <textarea id="out" readonly></textarea>
    <div class="actions">
      <button type="button" class="primary" id="copy">复制参数</button>
      <button type="button" id="reset">恢复默认</button>
    </div>
    <div class="note">调好后把“复制参数”的内容发给我，我来把它写成最终默认值并收尾。粉色字 = 与默认值不同。改动会自动保存在本浏览器里。</div>
  </aside>
</div>

<script type="module">
  import '../agent-robot-avatar.js';

  const config = window.AgentRobotAvatarLoveConfig;
  const defaults = window.AgentRobotAvatarLoveDefaults;
  const bounds = window.AgentRobotAvatarLoveBounds;

  // [key, label, step, group, replayNeeded, hint]
  const CONTROLS = [
    ['rx', '椭圆半宽 rx', 0.5, 'g-shape', false, '越大越胖'],
    ['ry', '椭圆半高 ry', 0.5, 'g-shape', false, '越大越长'],
    ['tilt', '倾角 tilt°', 0.5, 'g-shape', false, '越大两瓣上部分得越开，也越扁'],
    ['cross', '底部交叉 cross', 0.5, 'g-shape', false, '越大底部越圆润；太大会出现缺口或变尖'],
    ['centerY', '垂直位置 centerY', 0.5, 'g-shape', false, '心形视觉中心；头部中心 = 120'],
    ['pulse', '心跳幅度 pulse', 0.005, 'g-beat', false, '0 = 不跳'],
    ['beat', '每拍时长 ms', 10, 'g-beat', true, ''],
    ['beats', '拍数', 1, 'g-beat', true, ''],
    ['morphIn', '变心形 ms', 10, 'g-timing', true, ''],
    ['morphOut', '变回眼睛 ms', 10, 'g-timing', true, ''],
    ['prep', '起手停顿 ms', 10, 'g-timing', true, ''],
    ['swayAngle', '摇摆角度°', 0.1, 'g-head', true, '0 = 头不歪'],
    ['swayLift', '上浮 px', 0.1, 'g-head', true, ''],
  ];

  const $ = id => document.getElementById(id);
  const faces = [$('face'), $('faceMid'), $('faceSmall')];
  const primary = faces[0];
  const STORE = 'love-tuner-v1';
  const values = { ...defaults };
  const inputs = {};

  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    for (const key of Object.keys(defaults)) {
      if (Number.isFinite(saved[key])) values[key] = Math.min(bounds[key][1], Math.max(bounds[key][0], saved[key]));
    }
  } catch {}

  const decimals = step => (String(step).split('.')[1] || '').length;
  const fmt = (key, v) => Number(v).toFixed(decimals(CONTROLS.find(c => c[0] === key)[2]));

  for (const [key, label, step, group, , hint] of CONTROLS) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label for="r-${key}">${label}</label>
      <input type="range" id="r-${key}" min="${bounds[key][0]}" max="${bounds[key][1]}" step="${step}">
      <input type="number" id="n-${key}" min="${bounds[key][0]}" max="${bounds[key][1]}" step="${step}">
      <button type="button" class="undo" title="恢复默认值 ${defaults[key]}" aria-label="恢复 ${label} 为默认值">↺</button>
      ${hint ? `<div class="hint">${hint}</div>` : ''}`;
    $(group).appendChild(row);
    inputs[key] = { row, range: row.querySelector('[type=range]'), number: row.querySelector('[type=number]'), undo: row.querySelector('.undo') };
  }

  function stats() {
    const { rx, ry, tilt, cross, centerY } = values;
    const t = tilt * Math.PI / 180;
    const h = ry - 3;
    const hx = Math.hypot(rx * Math.cos(t), ry * Math.sin(t));
    const hy = Math.hypot(rx * Math.sin(t), ry * Math.cos(t));
    const width = 2 * (h * Math.sin(t) + hx - cross);
    const height = 2 * hy;
    // Head body spans 26..214 in both axes.
    const top = centerY - hy - 26;
    const bottom = 214 - (centerY + hy);
    const side = (188 - width) / 2;
    $('stats').innerHTML = `
      <span>心形宽 × 高</span><b>${width.toFixed(1)} × ${height.toFixed(1)}</b>
      <span>占头部宽度</span><b>${(width / 188 * 100).toFixed(0)}%</b>
      <span>距头顶 / 头底</span><b>${top.toFixed(1)} / ${bottom.toFixed(1)}</b>
      <span>距左 / 右边缘</span><b>${side.toFixed(1)} / ${side.toFixed(1)}</b>
      <span>原来两只眼睛</span><b>约 122 × 58</b>`;
    $('gHeart').style.top = `${centerY / 240 * 100}%`;
    $('gBody').style.cssText = 'left:10.83%;top:10.83%;right:10.83%;bottom:10.83%';
  }

  function sync(key) {
    const v = values[key];
    inputs[key].range.value = v;
    inputs[key].number.value = fmt(key, v);
    inputs[key].row.classList.toggle('changed', Math.abs(v - defaults[key]) > 1e-9);
    config[key] = v;
  }

  function refresh() {
    for (const key of Object.keys(inputs)) sync(key);
    // "Hold" keeps the heart on screen by stretching the beat count.
    config.beats = $('hold').checked ? 60 : values.beats;
    stats();
    const json = {};
    for (const key of Object.keys(defaults)) json[key] = Number(Number(values[key]).toFixed(4));
    $('out').value = JSON.stringify(json, null, 2);
    try { localStorage.setItem(STORE, JSON.stringify(json)); } catch {}
  }

  let replayTimer = 0;
  let loopTimer = 0;
  const play = () => {
    clearTimeout(loopTimer);
    config.beats = $('hold').checked ? 60 : values.beats;
    for (const face of faces) Promise.resolve(face.play('love')).catch(() => {});
  };
  const scheduleReplay = () => {
    if (!$('auto').checked) return;
    clearTimeout(replayTimer);
    replayTimer = setTimeout(play, 280);
  };

  for (const [key, , , , replay] of CONTROLS) {
    const set = raw => {
      const n = Number(raw);
      if (!Number.isFinite(n)) return;
      values[key] = Math.min(bounds[key][1], Math.max(bounds[key][0], n));
      refresh();
      if (replay) scheduleReplay();
    };
    inputs[key].range.addEventListener('input', e => set(e.target.value));
    inputs[key].number.addEventListener('change', e => set(e.target.value));
    inputs[key].undo.addEventListener('click', () => set(defaults[key]));
  }

  $('play').addEventListener('click', play);
  $('idle').addEventListener('click', () => {
    clearTimeout(replayTimer); clearTimeout(loopTimer);
    $('loop').checked = false;
    for (const face of faces) face.reset();
  });
  $('hold').addEventListener('change', () => { refresh(); play(); });
  $('loop').addEventListener('change', () => { if ($('loop').checked) play(); });
  $('guideToggle').addEventListener('change', e => $('guides').classList.toggle('on', e.target.checked));
  $('guides').classList.toggle('on', $('guideToggle').checked);
  $('reset').addEventListener('click', () => { Object.assign(values, defaults); refresh(); scheduleReplay(); });
  $('copy').addEventListener('click', async () => {
    const text = $('out').value;
    try { await navigator.clipboard.writeText(text); }
    catch { $('out').select(); document.execCommand('copy'); }
    $('copy').textContent = '已复制 ✓';
    setTimeout(() => { $('copy').textContent = '复制参数'; }, 1400);
  });

  primary.addEventListener('action-state', event => {
    const { action, phase } = event.detail;
    if (action === 'love' && phase === 'end' && $('loop').checked && !$('hold').checked) {
      loopTimer = setTimeout(play, 900);
    }
  });

  refresh();
  setTimeout(play, 500);
</script>
</body>
</html>
