<body class="skins-page" data-page="skins" data-avatar-size="160">
  <p class="demo-load-status" id="demoLoadStatus" role="status">Loading demo…</p>
  <header class="page-header" id="page-header">
    <nav class="demo-nav" aria-label="页面导航"><a id="demo-link" href="./index.html">演示</a><a href="./skins.html" aria-current="page">皮肤</a></nav>
  </header>
  <main class="workspace">
    <section class="preview" aria-label="皮肤预览"><div id="demo-root"></div></section>
    <section class="library" aria-labelledby="library-title">
      <h1 id="library-title" class="sr-only">皮肤</h1>
      <div class="filters" id="skin-filters" aria-label="皮肤分类"></div>
      <p class="sr-only" role="status"><span id="results-label">精选</span> <span id="results-count"></span></p>

        <label class="search-label"><span class="sr-only">搜索皮肤</span><input id="skin-search" type="search" placeholder="搜索皮肤" autocomplete="off"></label>
        <a id="all-skins-link" href="./materials/index.html">全部皮肤 ↗</a>

    </section>
