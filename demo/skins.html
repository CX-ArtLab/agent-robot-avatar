<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <script>document.documentElement.classList.add("demo-initializing", "skin-initializing");</script>
  <title>皮肤 · Agent Robot Avatar</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./agent-robot-avatar-demo.css">
  <link rel="stylesheet" href="./demo-shell.css">
  <link rel="stylesheet" href="./skins.css">
</head>
<body class="skins-page" data-page="skins" data-avatar-size="160">
  <p class="demo-load-status" id="demoLoadStatus" role="status">Loading demo…</p>
  <header class="page-header" id="page-header">
    <nav class="demo-nav" aria-label="页面导航"><a id="demo-link" href="./index.html">演示</a><a href="./skins.html" aria-current="page">皮肤</a></nav>
  </header>
  <main class="workspace">
    <section class="preview" aria-label="皮肤预览"><div id="demo-root"></div></section>
    <section class="library" aria-labelledby="library-title">
      <a class="skin-home-link" id="skin-home" href="./skins.html" hidden>← 返回精选</a>
      <div class="library-header"><h1 id="library-title">皮肤</h1><span id="collection-count"></span></div>
      <label class="search-label"><span class="sr-only">搜索皮肤</span><input id="skin-search" type="search" placeholder="搜索皮肤" autocomplete="off"></label>
      <div class="filters" id="skin-filters" aria-label="皮肤分类"></div>
      <div class="results-line"><span id="results-label">精选</span><span id="results-count" role="status"></span></div>
      <div class="skin-grid" id="skin-grid" aria-label="选择皮肤"></div>
      <div class="empty-state" id="empty-state" hidden><p>未找到皮肤</p><button type="button" id="clear-search">查看全部</button></div>
      <footer class="library-footer"><a id="all-skins-link" href="./materials/index.html">全部皮肤 ↗</a></footer>
    </section>
  </main>
  <noscript><p>请启用 JavaScript。</p></noscript>
  <script type="module" src="./skins.js"></script>
</body>
</html>
