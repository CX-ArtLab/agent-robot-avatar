<!doctype html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="google" content="notranslate" />
<title>Agent Robot Avatar — Interactive Demo</title>
<script>document.documentElement.classList.add("demo-initializing");</script>
<link rel="modulepreload" href="../agent-robot-avatar.js">
<link rel="modulepreload" href="./agent-robot-avatar-demo-controls.js">
<link rel="modulepreload" href="./agent-robot-avatar-demo-extras.js">
<link rel="modulepreload" href="./agent-robot-avatar-demo-roundness.js">
<link rel="modulepreload" href="./agent-robot-avatar-demo-layout.js">
<link rel="modulepreload" href="./agent-robot-avatar-demo-dialog-i18n.js">
<link rel="modulepreload" href="./agent-robot-avatar-demo-chat-avatar-mode.js">
<link rel="modulepreload" href="./agent-robot-avatar-demo-reply-loop.js">
<link rel="stylesheet" href="./agent-robot-avatar-demo.css">
<link rel="stylesheet" href="./demo-shell.css">
</head>
<body>
<p class="demo-load-status" id="demoLoadStatus" role="status">Loading demo…</p>
<noscript>This interactive demo requires JavaScript.</noscript>
<div class="canvas" id="canvas" aria-busy="true" inert>
  <div class="title demo-title"><span>Agent Robot Avatar</span><span>SVG + Vanilla JS</span><span>Web Component</span></div>
  <div class="build-badge" id="agent-demo-build">Demo 0.6.0</div>
  <label class="follow-control demo-original-follow" title="控制眼睛和头部是否跟随鼠标">
    <span>鼠标跟随</span>
    <input id="pointerFollow" type="checkbox" checked />
    <span class="follow-switch" aria-hidden="true"></span>
  </label>

<div class="demo-control-stack">
  <div class="demo-stage" id="demoStage">
    <div class="avatar-home" id="home">
      <agent-robot-avatar id="face" size="118" auto-sleep="18000"></agent-robot-avatar>
    </div>
    <div class="status-pill demo-status" id="status">idle · 默认待机</div>
    <button class="demo-stage-reset" id="demoStageReset" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
  </div>
  <div class="demo-chat-entry-hint" id="demoChatEntryHint" role="note"></div>
  <div class="controls" aria-label="Avatar states">
    <button type="button" data-action="idle">正常</button>
    <button type="button" data-action="bored">发呆</button>
    <button type="button" data-action="waiting-spin">等待 · 旋转</button>
    <button type="button" data-action="waiting-wrap">等待 · 环绕</button>
    <button type="button" data-action="waiting-wave">等待 · 波动</button>
    <button type="button" data-action="input">输入</button>
    <button type="button" data-action="affirm">肯定</button>
    <button type="button" data-action="success">成功</button>
    <button type="button" data-action="failure">失败</button>
    <button type="button" data-action="wary">警惕</button>
    <button type="button" data-action="inspect">审视</button>
    <button type="button" data-action="angry">生气</button>
    <button type="button" data-action="refuse">拒绝</button>
    <button type="button" data-action="surprise">惊讶</button>
    <button type="button" data-action="sleep">睡着</button>
    <button type="button" data-action="wake">醒来</button>
    <button type="button" data-action="love" class="is-new" data-new="NEW">喜欢</button>
    <button type="button" data-action="random" class="is-new" data-new="NEW">随机</button>
  </div>
  <div class="demo-options">
    <div class="demo-panel-toolbar" id="demoPanelToolbar">
      <div class="demo-toolbar-group" id="demoNavigationGroup">
      <button class="demo-panel-toggle" id="demoSettingsPanelToggle" type="button" aria-expanded="false" aria-controls="demoSettingsPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg>
      </button>
      <button class="demo-panel-toggle" id="demoLanguagePanelToggle" type="button" aria-expanded="false" aria-controls="demoLanguagePanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.3 2.4 3.5 5.4 3.5 9S14.3 18.6 12 21M12 3C9.7 5.4 8.5 8.4 8.5 12S9.7 18.6 12 21"/></svg>
      </button>
      </div>
      <div class="demo-roundness-control">
        <span class="demo-roundness-label" id="demoHeadRoundnessLabel"></span>
        <span class="demo-roundness-mark square" aria-hidden="true"></span>
        <input id="demoHeadRoundness" type="range" min="0" max="100" step="50" value="50" list="demoRoundnessStops">
        <datalist id="demoRoundnessStops"><option value="0"></option><option value="50"></option><option value="100"></option></datalist>
        <span class="demo-roundness-mark round" aria-hidden="true"></span>
        <label class="demo-roundness-unlock">
          <span id="demoHeadRoundnessUnlockLabel"></span>
          <input id="demoHeadRoundnessUnlock" type="checkbox">
          <span class="demo-roundness-switch" aria-hidden="true"></span>
        </label>
      </div>
      <div class="demo-toolbar-group" id="demoColorsGroup">
        <button class="demo-panel-toggle is-new" id="demoRandomColors" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle class="demo-dice-dot" cx="8.6" cy="8.6" r="1.4"/><circle class="demo-dice-dot" cx="15.4" cy="8.6" r="1.4"/><circle class="demo-dice-dot" cx="12" cy="12" r="1.4"/><circle class="demo-dice-dot" cx="8.6" cy="15.4" r="1.4"/><circle class="demo-dice-dot" cx="15.4" cy="15.4" r="1.4"/></svg>
        </button>
        <button class="demo-panel-toggle is-new" id="demoColorPanelToggle" type="button" aria-expanded="false" aria-controls="demoColorPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle class="demo-palette-dot" cx="13.5" cy="6.5" r=".5"/><circle class="demo-palette-dot" cx="17.5" cy="10.5" r=".5"/><circle class="demo-palette-dot" cx="6.5" cy="12.5" r=".5"/><circle class="demo-palette-dot" cx="8.5" cy="7.5" r=".5"/></svg>
        </button>
      </div>
    </div>
    <div class="demo-options-group demo-color-group" id="demoColorPanel" hidden>
      <div class="demo-swatches" id="demoColorPresets"></div>
      <p class="demo-palette-caption" id="demoPaletteCaption"></p>
      <div class="demo-color-custom">
        <label class="demo-option color-option"><span id="demoBgLabel"></span><input id="demoBgColor" type="color" value="#ffffff"></label>
        <button class="demo-option demo-icon-option demo-swap-button" id="demoSwapColors" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg></button>
        <label class="demo-option color-option"><span id="demoHeadLabel"></span><input id="demoHeadColor" type="color" value="#08090b"></label>
        <label class="demo-option demo-toggle"><span id="demoEyeThroughLabel"></span><input id="demoEyeThrough" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
        <button class="demo-option demo-reset" id="demoReset" type="button"></button>
      </div>
      <p class="demo-palette-note" id="demoPaletteNote"></p>
    </div>
    <div class="demo-options-group demo-behavior-group" id="demoSettingsPanel" hidden>
      <label class="demo-option demo-toggle"><span id="demoAntennaLabel"></span><input id="demoAntenna" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
      <label class="demo-option demo-toggle"><span id="demoLoopLabel"></span><input id="demoLoop" type="checkbox"><span class="demo-switch" aria-hidden="true"></span></label>
      <label class="demo-option demo-toggle"><span id="demoPointerFollowLabel"></span><input id="demoPointerFollow" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
    </div>
    <div class="demo-options-group demo-language-group" id="demoLanguagePanel" hidden>
      <button class="demo-language-option" type="button" data-lang="en">English</button>
      <button class="demo-language-option" type="button" data-lang="zh-CN">简体中文</button>
      <button class="demo-language-option" type="button" data-lang="zh-TW">繁體中文</button>
      <button class="demo-language-option" type="button" data-lang="ja">日本語</button>
      <button class="demo-language-option" type="button" data-lang="ko">한국어</button>
      <button class="demo-language-option" type="button" data-lang="es">Español</button>
      <button class="demo-language-option" type="button" data-lang="pt">Português</button>
      <button class="demo-language-option" type="button" data-lang="de">Deutsch</button>
      <button class="demo-language-option" type="button" data-lang="fr">Français</button>
    </div>
  </div>
</div>


  <a class="support-link" href="https://ko-fi.com/P0E625WIOI" target="_blank" rel="noopener noreferrer" aria-label="Buy me a coffee on Ko-fi">
    <span class="support-cup">☕</span><span>Buy me a coffee</span>
  </a>
</div>

<div class="agent-overlay" id="agentOverlay" aria-hidden="true">
  <section class="agent-phone" role="dialog" aria-modal="true" aria-label="Agent 对话演示">
    <div class="panel-head">
      <div class="panel-face-slot" id="slot"></div>
      <div class="panel-copy"><div class="panel-title">Agent</div><div class="panel-sub">随机状态回复演示</div></div>
      <button type="button" class="close" id="close" aria-label="关闭">×</button>
    </div>
    <div class="chat" id="chat">
      <div class="message agent"><div class="bubble">这是一个模拟 Agent。输入任意内容后，会随机模拟成功、风险确认、生气、拒绝等回复，并在正文下方标注对应表情。</div></div>
    </div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="输入内容……"></textarea>
        <div class="sendrow">
          <span class="hint">Enter 发送 · Shift+Enter 换行</span>
          <button type="button" class="send" id="send">发送</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script type="module" src="./agent-robot-avatar-demo.js"></script>
</body>
</html>
