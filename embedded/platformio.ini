[platformio]
default_envs = esp32-s3-st7789
src_dir = examples/arduino

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library@1.13.0
build_flags = -Wall -Wextra

[env:esp32-s3-st7789]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_TFT -D EYES_ESP32_S3

[env:pico-st7789]
platform = raspberrypi@1.20.0
board = pico
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_TFT -D EYES_PICO

[env:esp32-ssd1306]
platform = espressif32@6.12.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@2.5.17
build_flags = ${env.build_flags} -D EYES_OLED
