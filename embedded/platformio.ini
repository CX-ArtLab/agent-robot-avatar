[platformio]
default_envs = esp32-s3-st7789
src_dir = examples/arduino

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library@1.13.0
build_flags = -Wall -Wextra

[env:esp32-s3-st7789]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_TFT -D EYES_ESP32_S3

[env:pico-st7789]
platform = raspberrypi@1.20.0
board = pico
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_TFT -D EYES_PICO

[env:esp32-ssd1306]
platform = espressif32@6.12.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@2.5.17
build_flags = ${env.build_flags} -D EYES_OLED

; ---------------------------------------------------------------------------
; Board examples added for the hardware preview. Each compiles in CI; none has
; been tested on physical hardware yet. Pins follow each vendor's documentation.

[env:esp32-s3-gc9a01]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GC9A01A@1.1.0
build_flags = ${env.build_flags} -D EYES_BOARD_GC9A01

[env:waveshare-s3-round-128]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GC9A01A@1.1.0
build_flags = ${env.build_flags} -D EYES_BOARD_WAVESHARE_ROUND_128 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-st7789-240x280]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_BOARD_ST7789 -D EYES_PANEL_W=240 -D EYES_PANEL_H=280

[env:esp32-s3-st7789-240x320]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_BOARD_ST7789 -D EYES_PANEL_W=240 -D EYES_PANEL_H=320

[env:cyd-ili9341]
platform = espressif32@6.12.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ILI9341@1.6.2
build_flags = ${env.build_flags} -D EYES_BOARD_CYD

[env:t-display-st7789]
platform = espressif32@6.12.0
board = lilygo-t-display
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_BOARD_T_DISPLAY

[env:t-display-s3]
platform = espressif32@6.12.0
board = lilygo-t-display-s3
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
build_flags = ${env.build_flags} -D EYES_BOARD_T_DISPLAY_S3 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:m5-dial]
platform = espressif32@6.12.0
; The Dial is built on an M5 StampS3; M5Unified detects the Dial at runtime.
board = m5stack-stamps3
lib_deps =
  m5stack/M5Unified@0.2.22
  m5stack/M5GFX@0.2.29
build_flags = ${env.build_flags} -D EYES_BOARD_M5 -D EYES_PANEL_W=240 -D EYES_PANEL_H=240 -D EYES_PANEL_ROUND

[env:m5-atoms3]
platform = espressif32@6.12.0
board = m5stack-atoms3
lib_deps =
  m5stack/M5Unified@0.2.22
  m5stack/M5GFX@0.2.29
build_flags = ${env.build_flags} -D EYES_BOARD_M5 -D EYES_PANEL_W=128 -D EYES_PANEL_H=128

[env:m5-cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
lib_deps =
  m5stack/M5Unified@0.2.22
  m5stack/M5GFX@0.2.29
build_flags = ${env.build_flags} -D EYES_BOARD_M5 -D EYES_PANEL_W=320 -D EYES_PANEL_H=240

[env:m5-stickc-plus2]
platform = espressif32@6.12.0
; StickC Plus2 uses an ESP32-PICO like the M5Stick-C; M5Unified detects it at runtime.
board = m5stick-c
lib_deps =
  m5stack/M5Unified@0.2.22
  m5stack/M5GFX@0.2.29
build_flags = ${env.build_flags} -D EYES_BOARD_M5 -D EYES_PANEL_W=135 -D EYES_PANEL_H=240

[env:esp32-ssd1306-128x32]
platform = espressif32@6.12.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@2.5.17
build_flags = ${env.build_flags} -D EYES_PANEL_H=32

[env:esp32-sh1106]
platform = espressif32@6.12.0
board = esp32dev
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SH110X@2.1.14
build_flags = ${env.build_flags} -D EYES_BOARD_SH1106

; Second batch.

[env:esp32-s3-st7789-240x135]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_BOARD_ST7789 -D EYES_PANEL_W=240 -D EYES_PANEL_H=135 -D EYES_NATIVE_W=135 -D EYES_NATIVE_H=240 -D EYES_ROTATION=1

[env:esp32-s3-st7789-320x240]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_BOARD_ST7789 -D EYES_PANEL_W=320 -D EYES_PANEL_H=240 -D EYES_NATIVE_W=240 -D EYES_NATIVE_H=320 -D EYES_ROTATION=1

[env:esp32-s3-st7735-128x160]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_BOARD_ST7735 -D EYES_PANEL_W=128 -D EYES_PANEL_H=160 -D EYES_ST7735_TAB=INITR_BLACKTAB

[env:esp32-s3-st7735-160x80]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
build_flags = ${env.build_flags} -D EYES_BOARD_ST7735 -D EYES_PANEL_W=160 -D EYES_PANEL_H=80 -D EYES_ST7735_TAB=INITR_MINI160x80 -D EYES_ROTATION=1

[env:esp32-s3-ili9488]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
build_flags = ${env.build_flags} -D EYES_BOARD_ILI9488

[env:xiao-round-display]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GC9A01A@1.1.0
build_flags = ${env.build_flags} -D EYES_BOARD_XIAO_ROUND

[env:esp32-s3-box-3]
platform = espressif32@6.12.0
board = esp32s3box
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
build_flags = ${env.build_flags} -D EYES_BOARD_S3_BOX_3 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:waveshare-amoled-175]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
build_flags = ${env.build_flags} -D EYES_BOARD_AMOLED_175 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

; RGB panels keep a full frame in octal PSRAM.
[env:t-rgb-21]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
build_flags = ${env.build_flags} -D EYES_BOARD_T_RGB -D BOARD_HAS_PSRAM -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:guition-4848s040]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
build_flags = ${env.build_flags} -D EYES_BOARD_GUITION_4848 -D BOARD_HAS_PSRAM
