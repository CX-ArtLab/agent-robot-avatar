<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'">
<title>Agent Robot Avatar — Hardware Eyes Preview</title>
<style>
/* Project-owned styles copied from our demo/index.html. */
/*__PROJECT_CSS__*/
/* The skin page's two-column workspace in the demo's visual language: the
   module on a stage card with its actions and quick controls under it, and
   every other setting in the panel on the right. */
html,body{height:auto}
.canvas.preview{height:auto;min-height:100vh;padding:0;background-color:#f8f8f6;background-image:radial-gradient(#d7d9dc 1px,transparent 1px);background-size:24px 24px}
.preview .title span:not(:last-child)::after{content:' / '}
.page-header{height:64px}
.workspace{display:grid;grid-template-columns:minmax(0,720px) 380px;justify-content:center;max-width:1400px;margin:auto;padding:0 28px 24px;gap:28px;align-items:start;--column-height:clamp(600px,calc(100vh - 88px),960px)}
.preview [hidden]{display:none!important}
.preview button:disabled,.preview input:disabled,.preview select:disabled{opacity:.45;cursor:not-allowed;transform:none}
.preview input:focus-visible,.preview select:focus-visible,.preview button:focus-visible,.preview a:focus-visible{outline:2px solid #858b94;outline-offset:2px}
.card{border:1px solid rgba(0,0,0,.055);border-radius:16px;background:rgba(255,255,255,.88);box-shadow:0 7px 30px rgba(0,0,0,.06);backdrop-filter:blur(14px)}

/* Left: stage card, hint line, actions and quick controls */
/* The left column ends level with the panel: the stage takes the free height. */
.left{min-width:0;height:var(--column-height);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(260px,1fr) auto auto auto auto;gap:10px}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);border-radius:16px;
  background:radial-gradient(120% 90% at 50% 0%,#ffffff 0,#f3f4f5 100%)}
.stage-name{position:absolute;top:12px;left:0;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:#72777e;font-size:12px;z-index:6;pointer-events:none}
.stage-name .tag{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);font-size:11px;font-variant-numeric:tabular-nums}
.preview .stage .status-pill{position:absolute;left:50%;bottom:10px;top:auto;transform:translateX(-50%);z-index:6;padding:4px 9px;border:0;border-radius:999px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);color:rgba(0,0,0,.5);font-size:10px;white-space:nowrap;pointer-events:none}
.sensor-wrap{position:absolute;left:50%;top:50%}
/* Proximity zone: a tinted disc with a label, solid and greener while locked on. */
.sense-zone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1.5px dashed #b4bbc2;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(126,154,130,0) 45%,rgba(126,154,130,.08) 100%);transition:border-color .2s,background .2s}
.sense-zone::after{content:'感应范围';position:absolute;left:50%;top:var(--label-top,14px);transform:translateX(-50%);padding:2px 8px;border-radius:999px;background:#ffffffcc;font-size:10px;color:#858990;white-space:nowrap}
.sense-zone.active{border:1.5px solid #6f9a77;background:radial-gradient(circle,rgba(111,154,119,0) 40%,rgba(111,154,119,.16) 100%)}
.sense-zone.active::after{content:'正在注视';color:#4f7a57}
.device{position:relative;width:100%;height:100%;isolation:isolate}
.frame-art{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 2px 1px #12203733) drop-shadow(0 12px 12px #182e3c1f)}
.frame-art svg{display:block;width:100%;height:100%}
.glass{position:absolute;overflow:hidden;background:#000}
.device[data-profile=round] .glass{border-radius:50%}
/* Housing off hides only the artwork; the screen keeps its size and place. */
.device.bare .frame-art{visibility:hidden}
.device.generic-frame:not(.bare) .glass{outline:6px solid #222a2e;box-shadow:0 5px 12px #172d3c22}
.glass.show-area{overflow:visible;outline:1px dashed rgba(255,255,255,.34);outline-offset:1px}
.device.bare .glass.show-area{outline-color:rgba(120,126,134,.45)}
.device.generic-frame:not(.bare) .glass.show-area{outline:6px solid #222a2e}
#panel{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:inherit}
#screen{display:none}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 38%,rgba(255,255,255,0) 39%,rgba(255,255,255,.02))}
.target-dot{position:fixed;width:8px;height:8px;border-radius:50%;background:#8b9d8d;border:2px solid #fff;box-shadow:0 0 0 1px #8b9d8d;pointer-events:none;z-index:50}
/* One quiet line under the stage, like the demo's "try" hints. */
.hint-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;min-height:20px;font-size:10px;color:#9a9ea4}
.hint-row span{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.75);color:#858990}
.hint-row #tracking-note:empty{display:none}
#error{padding:12px 16px;background:#faecef;color:#9b626b;border-radius:12px;font-size:12px;justify-self:center}
.action-card{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;padding:8px}
/* The buttons sit in rows of even length; the script narrows this row. */
.preview .controls{position:static;transform:none;max-width:100%;justify-content:center;flex-wrap:wrap;z-index:auto;padding:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
.preview .controls button{position:relative}
.preview .controls button[aria-pressed=true]{background:#dfe1e4;color:#202327}
/* Quick controls: the demo's option bars, one for playback, one for viewing. */
.bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:7px 9px;border-radius:14px}
.view-bar{flex-direction:column;align-items:stretch;gap:0;padding:0 9px}
.bar-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:7px 0}
.bar-row + .bar-row{border-top:1px solid #f0f1f2}
.bar .divider{width:1px;height:20px;background:#e6e7e9;margin:0 2px}
.bar button,.bar .opt{min-height:30px;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:9px;background:#f4f5f6;color:#5f646a;font-size:11px;white-space:nowrap}
.bar button:hover{background:#e9eaec}
.bar button[aria-pressed=true]{background:#dfe1e4;color:#202327}
.bar .seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:#f4f5f6}
.bar .seg .chip{min-height:26px;padding:3px 8px;background:transparent;border-radius:7px}
.bar .seg .chip[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);color:#202327}
.bar .opt{position:relative;cursor:pointer;user-select:none}
.bar .opt > input[type=checkbox]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:auto;cursor:pointer;z-index:1}
/* The export: a button at the foot of the panel and a sheet with the file. */
.side-footer{display:flex;align-items:center;gap:10px;padding:12px 12px 0 0;border-top:1px solid #f0f1f2}
.side-footer .note{flex:1;font-size:11px;color:#9a9ea4}
#export,.sheet-actions button{flex-shrink:0;padding:10px 14px;border-radius:10px;background:#f1f2f3;color:#30343a;font-size:13px;font-weight:600;white-space:nowrap}
#export:hover,.sheet-actions button:hover{background:#e7e8ea;color:#15171a}
.sheet-actions .primary{background:#30343a;color:#fff}
.sheet-actions .primary:hover{background:#15171a;color:#fff}
.sheet-backdrop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(20,22,26,.18);backdrop-filter:blur(3px)}
.sheet{width:min(600px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:10px;padding:18px 20px;background:#fff}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font-size:14px;font-weight:600;color:#30343a}
.sheet-close{width:28px;height:28px;padding:0;border-radius:50%;background:#f1f2f3;color:#5f646a;font-size:16px;line-height:1}
.sheet code{font:11px ui-monospace,monospace;background:#f1f2f3;border-radius:5px;padding:1px 5px}
.sheet pre{flex:1;min-height:0;margin:0;overflow:auto;padding:12px 14px;border:1px solid #eeefef;border-radius:10px;background:#f8f8f6;color:#30343a;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.sheet-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.sheet-actions .note{flex:1;font-size:11px;color:#4f7a57}
/* A short note inside an option, after its switch. */
.opt-note{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#9a9ea4}
.opt-note svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.clock{font:11px/1.2 ui-monospace,monospace;font-variant-numeric:tabular-nums;padding:0 4px;color:#92969c;white-space:nowrap}
/* Auto-cycle shows that it is running, not just pressed. */
#demo[aria-pressed=true]{background:#666b72;color:#fff}
#demo[aria-pressed=true]::before{content:'';width:7px;height:7px;border-radius:50%;background:#9be7a8;animation:live 1.2s ease-in-out infinite}
@keyframes live{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){#demo[aria-pressed=true]::before{animation:none}}
.zoom-slider input{width:120px;margin:0;accent-color:#666b72;cursor:pointer}
.zoom-slider output{min-width:34px;font-size:11px;color:#6b7078;font-variant-numeric:tabular-nums;text-align:right}

/* Right: the options panel, built like the skin library */
.side{position:sticky;top:12px;height:var(--column-height);display:flex;flex-direction:column;min-width:0;padding:20px 8px 16px 20px;border:1px solid #e4e5e5;border-radius:16px;background:rgba(255,255,255,.88);box-shadow:0 7px 30px rgba(0,0,0,.035)}
.side-body{flex:1;min-height:0;overflow:auto;padding-right:12px;scrollbar-width:thin;scrollbar-color:#d8dade transparent}
.section{display:grid;gap:8px;padding:0 0 18px}
.section + .section{padding-top:16px;border-top:1px solid #f0f1f2}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px}
.section h2{margin:0;font-size:13px;font-weight:600;color:#555b63}
.section h2 small{margin-left:6px;font-size:11px;font-weight:400;color:#9a9ea4}
.stepper{display:flex;align-items:center;gap:2px;font-size:11px;color:#858990;font-variant-numeric:tabular-nums}
.stepper button{width:26px;height:24px;padding:0;border-radius:8px;background:#f4f5f6;color:#5f646a;font-size:13px}
.stepper button:hover{background:#e9eaec}
.stepper span{min-width:40px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.filters .chip{font-size:11px;padding:7px 9px;border-radius:9px;background:#f1f2f3;color:#72777e}
.filters .chip:hover{background:#e7e8ea}
.filters .chip[aria-pressed=true]{background:#dfe1e4;color:#202327}
/* The screen picker: a button and a rounded list in the page's own style. */
.picker{position:relative}
.profile-select{width:100%;height:40px;display:flex;align-items:center;gap:8px;padding:0 34px 0 12px;border:1px solid #e4e5e5;border-radius:10px;background:#f8f8f6;color:#30343a;font:600 12.5px Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;text-align:left;cursor:pointer;position:relative}
.profile-select:hover{background:#f8f8f6;border-color:#d3d6da}
.profile-select::after{content:'';position:absolute;right:14px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid #858990;border-bottom:1.5px solid #858990;transform:rotate(45deg);transition:transform .15s,margin-top .15s}
.profile-select[aria-expanded=true]{border-color:#d3d6da;background:#fff}
.profile-select[aria-expanded=true]::after{transform:rotate(-135deg);margin-top:-1px}
.profile-select #profile-name,.picker-list .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{flex:0 0 auto;font-weight:400;font-size:11px;color:#9a9ea4;font-variant-numeric:tabular-nums}
.picker-list{position:fixed;z-index:60;overflow:auto;padding:5px;border:1px solid #e4e5e5;border-radius:12px;background:#fff;box-shadow:0 12px 34px rgba(0,0,0,.1);scrollbar-width:thin;scrollbar-color:#d8dade transparent}
.picker-list button{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;background:transparent;color:#4a4f56;font-size:12px;text-align:left}
.picker-list button:hover,.picker-list button:focus-visible{background:#f4f5f6;outline:none}
.picker-list button[aria-selected=true]{background:#f1f2f3;color:#202327;font-weight:600}
.spec-badges{display:flex;flex-wrap:wrap;gap:5px}
.spec-badges span{padding:4px 9px;border-radius:999px;background:#f1f2f3;color:#30343a;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.meta{font-size:11px;line-height:1.6;color:#858990}
.frame-source{color:#5d6670;text-decoration:none;margin-left:4px;white-space:nowrap}
.frame-source:hover{text-decoration:underline}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.field{position:relative;display:flex;align-items:center;gap:8px;min-height:36px;padding:5px 10px;border-radius:10px;background:#f8f8f6;border:1px solid #eeefef;font-size:12px;color:#5f646a;user-select:none;min-width:0}
.field > span:first-child{flex:0 0 auto;white-space:nowrap}
.field input[type=range]{flex:1;min-width:30px;height:18px;margin:0;accent-color:#666b72;cursor:pointer}
.field output{flex:0 0 auto;min-width:34px;text-align:right;font-variant-numeric:tabular-nums;color:#8a8f98;font-size:11px}
.field input[type=color]{width:28px;height:22px;padding:0;border:0;border-radius:6px;background:transparent;cursor:pointer}
.field input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
.field input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.12);border-radius:5px}
.field input[type=number]{width:62px;border:1px solid #e4e5e5;background:#fff;border-radius:7px;padding:4px 6px;font:inherit;color:#3f454c}
.field .push{margin-left:auto}
.field .sep{width:1px;height:18px;background:#e2e4e7;flex:0 0 auto}
.toggle{cursor:pointer}
.toggle .demo-switch{flex:0 0 auto}
/* The transparent checkbox sits exactly over its switch, so it is the click target. */
.toggle > input{position:absolute;right:10px;top:50%;width:30px;height:18px;margin:-9px 0 0;opacity:0;pointer-events:auto;cursor:pointer;z-index:1}
.toggle > span:first-child{flex:1}
.inline-toggle{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer}
.inline-toggle > input{position:absolute;right:0;top:50%;width:30px;height:18px;margin:-9px 0 0;opacity:0;cursor:pointer;z-index:1}
.chip{background:#f1f2f3;color:#5f646a;border-radius:9px;padding:7px 10px;font-size:12px}
.chip:hover{background:#e7e8ea}
.chip[aria-pressed=true]{background:#dfe1e4;color:#202327}
/* Segmented choices: a light track with the chosen one raised in white. */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:11px;background:#f1f2f3}
.seg .chip{background:transparent;padding:7px 4px;font-size:12px}
.seg .chip[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);color:#202327;font-weight:600}
.field .seg{flex:0 1 auto;padding:2px;border-radius:8px;background:#eceded;grid-auto-columns:auto}
.field .seg .chip{padding:5px 10px;font-size:11.5px;border-radius:7px}
.seg[aria-disabled=true]{opacity:.4;pointer-events:none}
.row-end{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row-end .note{font-size:11px;line-height:1.5;color:#9a9ea4}
.row-end button,.small-button{flex:0 0 auto;padding:7px 12px;border-radius:9px;font-size:11px;background:#f1f2f3;color:#4a4f56}
.wiring{border:1px solid #eeefef;border-radius:10px;background:#f8f8f6;font-size:12px;color:#4a4f56}
.wiring summary{padding:9px 11px;cursor:pointer;font-weight:600}
.wiring > div{padding:0 11px 11px;display:grid;gap:6px}
.wiring table{width:100%;border-collapse:collapse;font-size:11.5px}
.wiring td{padding:3px 0;border-bottom:1px solid #eceded}
.wiring td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:#2f343a;font-weight:600}
.wiring code{font:11px ui-monospace,monospace;background:#fff;border-radius:5px;padding:2px 5px}
.wiring a{color:#4a6fa5}
.colors-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:6px}
/* The Web demo's palettes, turned for a screen: the face colour around a
   round eye in the background colour. */
.swatches{display:grid;grid-template-columns:repeat(10,26px);justify-content:space-between;gap:8px 4px;padding-top:2px}
.swatch{position:relative;width:26px;height:26px;padding:0;border-radius:7px;background:var(--face);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .15s ease,box-shadow .15s ease}
.swatch::before{content:'';position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--eye);box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.swatch:hover{background:var(--face);transform:translateY(-2px) scale(1.08)}
.swatch:active{transform:none}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2px #25282c}
.swatch[aria-pressed=true]:hover{transform:none}
@media(prefers-reduced-motion:reduce){.swatch{transition:none}}
.icon-button{display:grid;place-items:center;width:36px;padding:0!important}
.icon-button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#size-error{font-size:11px;color:#a36f78}
.group{display:grid;gap:6px}

@media(max-width:1180px){.workspace{grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding-inline:16px}}
@media(max-width:860px){
  .page-header{height:84px}
  .preview .title{left:16px;top:14px;max-width:calc(100% - 130px);line-height:1.5}
  .preview .build-badge{right:16px;top:14px}
  .workspace{display:block;padding:0 10px 20px}
  .left{height:auto;grid-template-rows:none}
  .stage{height:clamp(260px,46vh,420px)}
  .side{position:static;height:auto;max-height:none;min-height:0;margin-top:14px;padding:16px}
  .side-body{overflow:visible;padding-right:0}
  }
@media(max-width:420px){.pair{grid-template-columns:minmax(0,1fr)}.zoom-slider input{width:90px}}
</style>
</head>

<div class="canvas preview" id="demo-canvas">
<header class="page-header">
  <div class="title"><span>Agent Robot Avatar</span><span>C++ + WebAssembly</span><span>硬件表情版</span></div>
  <div class="build-badge">硬件 __VERSION__ · 实验版</div>
</header>
<div class="workspace">
<main class="left">
  <div class="stage card" id="stage">
    <div class="stage-name"><span id="stage-title"></span><span class="tag" id="stage-res"></span></div>
    <div class="sensor-wrap" id="sensor-wrap">
      <div class="sense-zone" id="sense-zone" aria-hidden="true"></div>
      <div class="device" id="device" data-profile="tft">
        <div class="frame-art" id="frame-art" aria-hidden="true"></div>
        <div class="glass" id="glass"><canvas id="panel" role="img" aria-label="硬件表情动画预览"></canvas><div class="glare" id="glare"></div></div>
      </div>
    </div>
    <div class="status-pill" id="current" role="status">idle · 正常</div>
  </div>
  <noscript>此预览需要启用 JavaScript。</noscript><div id="error" role="alert" hidden></div>
  <div class="hint-row"><span id="tracking-note" role="status"></span><span>空格键暂停／继续</span></div>
  <div class="action-card card"><div class="controls" id="actions" role="group" aria-label="选择表情"></div></div>
  <div class="bar card" aria-label="播放">
    <button id="pause" title="也可以按空格键" disabled>暂停</button><button id="step" title="暂停后可逐帧查看" disabled>下一帧</button><button id="demo" aria-pressed="false" disabled>自动轮播</button><button id="reset" title="从“正常”重新开始，保留所有设置" disabled>重置</button>
    <span class="divider" aria-hidden="true"></span>
    <div class="seg" id="speed" data-value="1" role="group" aria-label="播放速度"><button class="chip" type="button" data-value="0.25">0.25×</button><button class="chip" type="button" data-value="0.5">0.5×</button><button class="chip" type="button" data-value="1">1×</button><button class="chip" type="button" data-value="2">2×</button></div>
    <span class="clock" id="clock" title="模拟时间：暂停时停止，慢放时变慢">时间 0.0 s</span>
  </div>
  <div class="bar card view-bar" aria-label="显示">
    <div class="bar-row">
      <button class="chip" type="button" id="rotate">屏幕旋转 90°</button>
      <span class="divider" aria-hidden="true"></span>
      <button class="chip" type="button" id="zoom-fit" data-zoom="fit">适合窗口</button>
      <button class="chip" type="button" id="zoom-real" data-zoom="1">实物大小</button>
      <label class="opt zoom-slider" title="缩放（相对实物大小），最大到放满窗口；在常用比例附近会轻轻吸附"><input id="zoom" type="range" min="0" max="1000" value="1000" aria-label="缩放"><output id="zoom-value">1.0×</output></label>
    </div>
    <div class="bar-row">
      <label class="opt demo-toggle"><span>外框</span><input id="housing" type="checkbox" checked disabled><span class="demo-switch" aria-hidden="true"></span></label>
      <label class="opt demo-toggle"><span>像素区虚线</span><input id="show-area" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
      <label class="opt demo-toggle" title="开发板要外接摄像头，或距离／人体感应传感器，才知道物体在哪；这里用鼠标模拟靠近的物体"><span>注视跟随</span><input id="follow" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span><small class="opt-note"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4M8 4.9v.1"/></svg>需外接摄像头或传感器</small></label>
    </div>
  </div>
  <canvas id="screen" width="240" height="240" aria-hidden="true"></canvas>
</main>

<aside class="side" aria-label="功能选项">
  <div class="side-body">
  <section class="section">
    <div class="section-head">
      <h2>屏幕</h2>
      <div class="stepper" id="stepper"><button type="button" id="prev-profile" title="上一个型号" aria-label="上一个型号" disabled>‹</button><span id="profile-index"></span><button type="button" id="next-profile" title="下一个型号" aria-label="下一个型号" disabled>›</button></div>
    </div>
    <div class="filters" id="screen-groups" role="group" aria-label="屏幕类型"></div>
    <div class="picker"><button type="button" id="profile" class="profile-select" aria-haspopup="listbox" aria-expanded="false" aria-label="屏幕型号" disabled><span id="profile-name"></span><span class="res" id="profile-res"></span></button>
      <div class="picker-list" id="profile-list" role="listbox" aria-label="屏幕型号" hidden></div></div>
    <div id="custom-size" class="group" hidden>
      <div class="field"><span>尺寸</span><input id="custom-width" type="number" min="16" max="512" value="240" aria-label="宽"><span>×</span><input id="custom-height" type="number" min="16" max="512" value="160" aria-label="高">
        <div class="seg push" id="custom-shape" data-value="0" role="group" aria-label="形状"><button class="chip" type="button" data-value="0">矩形</button><button class="chip" type="button" data-value="1">圆形</button></div></div>
      <span id="size-error" role="status"></span>
    </div>
    <div class="spec-badges"><span id="spec-res" title="分辨率"></span><span id="spec-color" title="色彩"></span><span id="spec-fps" title="按连接总线带宽估算的整屏刷新上限"></span></div>
    <details class="wiring" id="wiring"><summary>型号与接线</summary><div>
      <div class="meta"><span id="screen-spec"></span><br><span id="screen-support"></span><br><span id="stage-caption">正在载入屏幕模组…</span><a class="frame-source" id="frame-source" target="_blank" rel="noopener noreferrer" hidden>模组资料 ↗</a></div>
      <div id="wiring-body" class="group"></div>
    </div></details>
  </section>

  <section class="section">
    <div class="section-head"><h2>眼睛布局<small>当前屏幕</small></h2></div>
    <div class="seg" id="fit" role="group" aria-label="布局方式">
      <button class="chip" type="button" data-fit="preset">预设布局</button>
      <button class="chip" type="button" data-fit="contain">完整显示</button>
      <button class="chip" type="button" data-fit="cover">填满屏幕</button>
    </div>
    <div class="meta" id="profile-note"></div>
    <label class="field"><span>表情大小</span><input id="face-scale" type="range" min=".25" max="3" step=".05" value="1"><output id="scale-value">1.00</output></label>
    <div class="pair">
      <label class="field"><span>水平</span><input id="offset-x" type="range" min="-1" max="1" step=".05" value="0"><output id="offset-x-value">0.00</output></label>
      <label class="field"><span>垂直</span><input id="offset-y" type="range" min="-1" max="1" step=".05" value="0"><output id="offset-y-value">0.00</output></label>
    </div>
    <div class="row-end"><span class="note">每块屏单独保存</span><button type="button" id="layout-reset">恢复默认布局</button></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>动画</h2></div>
    <div class="field"><span>帧率上限</span><div class="seg push" id="fps" role="group" aria-label="帧率上限"></div></div>
    <div class="pair">
      <label class="field toggle demo-toggle"><span>眨眼</span><input id="blink" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
      <label class="field toggle demo-toggle"><span>打断过渡</span><input id="transitions" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>颜色</h2></div>
    <div class="colors-row" id="color-options">
      <label class="field"><span>眼睛</span><input class="push" id="eye-color" type="color" value="#ffffff"></label>
      <label class="field"><span>底色</span><input class="push" id="bg-color" type="color" value="#000000"></label>
      <button type="button" class="small-button icon-button" id="color-swap" title="互换眼睛和底色" aria-label="互换眼睛和底色"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg></button>
      <button type="button" class="small-button" id="color-reset" title="恢复白眼睛、黑底色">恢复</button>
    </div>
    <div class="swatches" id="palettes" role="group" aria-label="配色"></div>
    <div class="field" id="mono-options"><span>OLED 发光</span><div class="seg push" id="mono-chips" role="group" aria-label="OLED 发光颜色"></div></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>屏幕效果</h2></div>
    <div class="pair">
      <label class="field toggle demo-toggle" title="放大后显示像素格和红绿蓝子像素"><span>像素颗粒</span><input id="pixel-grid" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
      <label class="field toggle demo-toggle" title="外框玻璃的反光"><span>玻璃反光</span><input id="glass-glare" type="checkbox" checked><span class="demo-switch" aria-hidden="true"></span></label>
    </div>
  </section>

  </div>
  <div class="side-footer">
    <span class="note">调好后导出，放进固件就能用</span>
    <button type="button" id="export" disabled>导出设置</button>
  </div>
</aside>
</div>
<div class="target-dot" id="target-dot" aria-hidden="true" hidden></div>

    <div class="sheet-actions"><span class="note" id="export-status" role="status"></span><button type="button" id="export-download">下载文件</button><button type="button" id="export-copy" class="primary">复制</button></div>
  </div>
</div>
