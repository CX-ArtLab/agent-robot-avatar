name: Bug report
description: Report a reproducible problem with the component or demo
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable set of steps.
      placeholder: |
        1. Load...
        2. Trigger...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 151, Safari 19, Firefox 145...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS, iOS, Android...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, recordings, console output, or minimal examples are useful here.
