name: One-off README support cleanup

on:
  push:
    branches:
      - codex/runtime-lifecycle-accessibility
    paths:
      - .github/workflows/docs-support-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-lifecycle-accessibility
          fetch-depth: 0

      - name: Keep only the Ko-fi button outside Simplified Chinese
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('README.md')]
          files += sorted(
              p for p in Path('docs').glob('README.*.md')
              if p.name != 'README.zh-CN.md'
          )

          changed = []
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              button = next((i for i, line in enumerate(lines) if 'ko-fi.com/P0E625WIOI' in line and '<a href=' in line), None)
              if button is None:
                  raise RuntimeError(f'Ko-fi button not found in {path}')

              heading = None
              for i in range(button - 1, -1, -1):
                  if lines[i].startswith('## '):
                      heading = i
                      break
              if heading is None:
                  raise RuntimeError(f'Support heading not found in {path}')

              lines[heading + 1:button] = ['']
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              changed.append(str(path))

          if len(changed) != 8:
              raise RuntimeError(f'Expected 8 README files, changed {len(changed)}: {changed}')

          print('Reduced support sections to heading + Ko-fi button:')
          print('\n'.join(changed))
          PY

      - name: Commit README-only cleanup and remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/docs-support-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.*.md
          git commit -m "docs: keep Ko-fi only outside zh-CN"
          git push origin HEAD:codex/runtime-lifecycle-accessibility
