name: One-off README support cleanup

on:
  push:
    branches:
      - codex/runtime-lifecycle-accessibility
    paths:
      - .github/workflows/docs-support-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-lifecycle-accessibility
          fetch-depth: 0

      - name: Simplify support sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('README.md')]
          files += sorted(
              p for p in Path('docs').glob('README.*.md')
              if p.name != 'README.zh-CN.md'
          )

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              replaced = False

              for i in range(len(lines) - 2):
                  if not lines[i].strip().startswith('| Ko-fi |'):
                      continue
                  if '---' not in lines[i + 1] or 'ko-fi.com/P0E625WIOI' not in lines[i + 2]:
                      continue

                  cells = [cell.strip() for cell in lines[i + 2].strip().strip('|').split('|')]
                  if not cells or 'ko-fi.com/P0E625WIOI' not in cells[0]:
                      raise RuntimeError(f'Could not isolate Ko-fi button in {path}')

                  lines[i:i + 3] = [cells[0]]
                  replaced = True
                  break

              if not replaced:
                  raise RuntimeError(f'Support table not found in {path}')

              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              changed.append(str(path))

          expected = 8
          if len(changed) != expected:
              raise RuntimeError(f'Expected {expected} README files, changed {len(changed)}: {changed}')

          print('Updated support sections:')
          print('\n'.join(changed))
          PY

      - name: Commit README-only cleanup and remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/docs-support-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.*.md
          git commit -m "docs: simplify support buttons"
          git push origin HEAD:codex/runtime-lifecycle-accessibility
