name: Publish npm v0.3.0

on:
  push:
    branches:
      - codex/release-0.3.0
    paths:
      - .github/workflows/publish-npm-v0.3.0.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released main commit
        uses: actions/checkout@v4
        with:
          ref: f73af5ad7cabf29e39e6ed6c0f525bc880de740f

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify package
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='agent-robot-avatar'||p.version!=='0.3.0') process.exit(1)"
          npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured in this repository."
            exit 78
          fi
          npm publish --ignore-scripts --access public --tag latest

      - name: Remove one-off workflow from release branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish-npm-v0.3.0.yml" \
            -f message='chore: remove one-off npm publish workflow' \
            -f sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish-npm-v0.3.0.yml?ref=codex/release-0.3.0" --jq .sha)" \
            -f branch='codex/release-0.3.0' || true
