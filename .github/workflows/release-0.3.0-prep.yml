name: Prepare v0.3.0 release

on:
  push:
    branches:
      - codex/release-0.3.0
    paths:
      - .github/workflows/release-0.3.0-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-0.3.0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update release version and documentation
        shell: bash
        run: |
          npm version 0.3.0 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path

          old = '0.2.1'
          new = '0.3.0'

          version_file = Path('src/agent-robot-avatar-version.js')
          text = version_file.read_text(encoding='utf-8')
          expected = "const VERSION = '0.2.1';"
          if expected not in text:
              raise RuntimeError('Runtime version source is not at 0.2.1')
          version_file.write_text(text.replace(expected, "const VERSION = '0.3.0';", 1), encoding='utf-8')

          test_file = Path('tests/avatar.spec.mjs')
          text = test_file.read_text(encoding='utf-8')
          if text.count('0.2.1') < 3:
              raise RuntimeError('Expected demo/runtime version assertions were not found')
          test_file.write_text(text.replace('0.2.1', '0.3.0'), encoding='utf-8')

          readmes = [Path('README.md')] + sorted(Path('docs').glob('README.*.md'))
          for path in readmes:
              lines = path.read_text(encoding='utf-8').splitlines()
              changed = 0
              output = []
              for line in lines:
                  original = line
                  line = line.replace('version-v0.2.1-', 'version-v0.3.0-')
                  if 'v0.2.1' in line and 'Default configuration keeps the existing v0.2.1 visual timing.' not in line:
                      line = line.replace('v0.2.1', 'v0.3.0')
                  if line != original:
                      changed += 1
                  output.append(line)
              if changed < 3:
                  raise RuntimeError(f'Expected at least 3 public-version updates in {path}, got {changed}')
              path.write_text('\n'.join(output) + '\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n\n'
          if marker not in text:
              raise RuntimeError('Unreleased changelog heading not found')
          text = text.replace(marker, '## [Unreleased]\n\n## [0.3.0] - 2026-09-10\n\n', 1)
          link_marker = '[0.2.1]: https://github.com/CX-ArtLab/agent-robot-avatar/releases/tag/v0.2.1'
          if link_marker not in text:
              raise RuntimeError('0.2.1 changelog link marker not found')
          text = text.replace(link_marker, '[0.3.0]: https://github.com/CX-ArtLab/agent-robot-avatar/releases/tag/v0.3.0\n' + link_marker, 1)
          changelog.write_text(text, encoding='utf-8')

          # After the release bump, 0.2.1 may remain only as historical changelog data
          # and in the explicit compatibility note about preserved inspect timing.
          import subprocess
          result = subprocess.run(['git', 'grep', '-n', '0.2.1'], text=True, capture_output=True)
          unexpected = []
          for entry in result.stdout.splitlines():
              if entry.startswith('CHANGELOG.md:'):
                  continue
              if entry.startswith('README.md:') and 'Default configuration keeps the existing v0.2.1 visual timing.' in entry:
                  continue
              unexpected.append(entry)
          if unexpected:
              raise RuntimeError('Unexpected remaining 0.2.1 references:\n' + '\n'.join(unexpected))
          PY

      - name: Commit release update and remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/release-0.3.0-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md docs/README.*.md package.json package-lock.json src/agent-robot-avatar-version.js tests/avatar.spec.mjs
          git commit -m "release: prepare agent-robot-avatar v0.3.0"
          git push origin HEAD:codex/release-0.3.0
