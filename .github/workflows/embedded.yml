name: Embedded Eyes

on:
  push:
    branches: [main]
    paths: ['embedded/**', 'src/**', '.github/workflows/embedded.yml']
  pull_request:
    paths: ['embedded/**', 'src/**', '.github/workflows/embedded.yml']

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Portable core tests with address and undefined-behavior sanitizers
        run: bash embedded/tools/test-native.sh

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32-s3-st7789, pico-st7789, esp32-ssd1306, esp32-s3-gc9a01, waveshare-s3-round-128,
          esp32-s3-st7789-240x280, esp32-s3-st7789-240x320, cyd-ili9341, t-display-st7789, t-display-s3,
          m5-dial, m5-atoms3, m5-cores3, m5-stickc-plus2, esp32-ssd1306-128x32, esp32-sh1106,
          esp32-s3-st7789-240x135, esp32-s3-st7789-320x240, esp32-s3-st7735-128x160, esp32-s3-st7735-160x80,
          esp32-s3-ili9488, xiao-round-display, esp32-s3-box-3, waveshare-amoled-175, t-rgb-21, guition-4848s040,
          nucleo-f411re-st7789, blackpill-f411-ssd1306]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile reference firmware (not a physical hardware test)
        run: pio run --project-dir embedded --environment ${{ matrix.environment }}
      - name: Save experimental firmware
        uses: actions/upload-artifact@v4
        with:
          name: eyes-${{ matrix.environment }}
          path: |
            embedded/.pio/build/${{ matrix.environment }}/firmware.bin
            embedded/.pio/build/${{ matrix.environment }}/firmware.uf2
          if-no-files-found: error

  library-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: SerialEyes, board: esp32dev, platform: espressif32@6.12.0, deps: '' }
          - { example: SerialEyes, board: pico, platform: raspberrypi@1.20.0, deps: '' }
          - { example: OledSSD1306, board: esp32dev, platform: espressif32@6.12.0, deps: 'adafruit/Adafruit SSD1306@2.5.17' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile the library's Arduino IDE example (not a physical hardware test)
        run: |
          pio ci "embedded/lib/BoopFace/examples/${{ matrix.example }}/${{ matrix.example }}.ino" \
            --lib embedded/lib/BoopFace --board ${{ matrix.board }} \
            -O "platform=${{ matrix.platform }}" ${{ matrix.deps && format('-O "lib_deps={0}"', matrix.deps) || '' }}

  offline-preview:
    # Stable OS/dependency set for the browser and pinned WASM toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build-only WASM toolchain
        run: |
          python -m pip install ziglang==0.13.0
          python -c "import pathlib, ziglang, os; p=pathlib.Path(ziglang.__file__).parent/'zig'; open(os.environ['GITHUB_ENV'],'a').write('ZIG='+str(p)+'\n')"
      - name: Check committed preview source freshness and native/WASM parity
        run: node embedded/tools/test-preview.mjs
      - name: Rebuild self-contained preview
        run: |
          node embedded/tools/build-preview.mjs
          git diff --exit-code -- embedded/preview/boopface-embedded-preview.html
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false @resvg/resvg-js@2.6.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Compare against the original Web expression SVGs
        run: |
          node embedded/tools/sample-web-expressions.mjs
          git diff --exit-code -- embedded/lib/BoopFace/src/BoopFaceWebMotion.h embedded/tests/web-reference.json embedded/tests/web-visual-reference.json
          node embedded/tools/test-web-fidelity.mjs
      - name: Test local file offline in Chromium, Firefox and WebKit
        run: |
          node embedded/tools/test-preview-ui.mjs
          PREVIEW_BROWSER=firefox node embedded/tools/test-preview-ui.mjs
          PREVIEW_BROWSER=webkit node embedded/tools/test-preview-ui.mjs
          node embedded/tools/test-preview-i18n.mjs
      - name: Check the standalone Arduino ZIP
        run: node embedded/tools/package-release.mjs "eyes-v$(node -p 'JSON.parse(require("fs").readFileSync("embedded/lib/BoopFace/library.json")).version')" "$RUNNER_TEMP/BoopFace-Embedded.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-eyes-preview
          path: embedded/preview/boopface-embedded-preview.html
