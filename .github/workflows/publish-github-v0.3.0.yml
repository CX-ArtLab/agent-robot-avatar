name: Publish GitHub release v0.3.0

on:
  push:
    branches:
      - codex/release-0.3.0
    paths:
      - .github/workflows/publish-github-v0.3.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released main commit
        uses: actions/checkout@v4
        with:
          ref: f73af5ad7cabf29e39e6ed6c0f525bc880de740f

      - name: Verify release source
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.3.0') process.exit(1)"
          grep -q "const VERSION = '0.3.0';" src/agent-robot-avatar-version.js
          grep -q '^## \[0.3.0\] - 2026-09-10$' CHANGELOG.md

      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.0 release already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Highlights

          - Added `wake-on="activity|interaction|manual"` for configurable wake behavior.
          - Added `motion="auto|reduce|full"` with system reduced-motion support.
          - Added semantic `action-state` lifecycle events for host integrations and accessibility.
          - Improved cancellation, drag/touch handling, size validation, and inspect configuration.
          - Added visibility-aware rendering pauses and per-frame pointer coalescing.
          - Expanded automated validation across Chromium, Firefox, and WebKit.

          See `CHANGELOG.md` for the complete release notes.
          EOF
          gh release create v0.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target f73af5ad7cabf29e39e6ed6c0f525bc880de740f \
            --title "Agent Robot Avatar v0.3.0" \
            --notes-file /tmp/release-notes.md

      - name: Remove one-off workflow from release branch
        if: always()
        shell: bash
        run: |
          git fetch origin codex/release-0.3.0
          git checkout -B codex/release-0.3.0 origin/codex/release-0.3.0
          git rm .github/workflows/publish-github-v0.3.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-off GitHub release workflow"
          git push origin HEAD:codex/release-0.3.0
