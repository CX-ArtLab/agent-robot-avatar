<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agent Robot Avatar — Accessible Status Example</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#f7f7f5;font-family:system-ui,sans-serif}
    main{display:grid;gap:20px;justify-items:center}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    button{border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
    #agent-status{min-height:1.5em;max-width:34rem;text-align:center}
  </style>
</head>
<body>
  <main>
    <agent-robot-avatar id="avatar" size="140"></agent-robot-avatar>
    <div class="actions">
      <button type="button" data-action="waiting">Start request</button>
      <button type="button" data-action="success">Success</button>
      <button type="button" data-action="failure">Failure</button>
      <button type="button" data-action="error">Connection error</button>
    </div>
    <div id="agent-status" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script type="module">
    import '../agent-robot-avatar.js';

    const avatar = document.querySelector('#avatar');
    const status = document.querySelector('#agent-status');
    const messages = {
      waiting: 'Processing…',
      success: 'Task completed.',
      failure: 'Task failed.',
      error: 'Connection problem.',
    };

    avatar.addEventListener('action-state', (event) => {
      const { action, phase, source } = event.detail;
      if (source === 'interaction') return; // Do not announce decorative drag reactions.
      if (phase === 'start' && messages[action]) status.textContent = messages[action];
      if (action === 'waiting' && phase === 'cancel') status.textContent = '';
    });

    document.querySelector('.actions').addEventListener('click', (event) => {
      const action = event.target.dataset.action;
      if (!action) return;
      if (action === 'waiting') avatar.startWaiting();
      else avatar.play(action);
    });
  </script>
</body>
</html>
